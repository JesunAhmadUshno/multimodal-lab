name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -r requirements.txt ruff==0.17.4
      - name: Lint (ruff, scope in ruff.toml)
        run: ruff check .
      - name: Layout check (required files, abstract, headline traced, no public grade)
        run: python tests/test_smoke.py -v
      - name: All tests (run as scripts)
        run: for t in tests/test_*.py; do echo "== $t"; python "$t" || exit 1; done
      - name: Results regenerate unchanged from the code and seeds
        run: |
          python level-1-learn/run_learn.py > /dev/null
          python level-2-build/run_build.py > /dev/null
          python level-3-deep/run_deep.py > /dev/null
          python analysis/run_seeds.py > /dev/null
          python analysis/paired_stats.py > /dev/null
          python analysis/count_baseline.py > /dev/null
          git diff --exit-code -- level-1-learn/results_learn.json level-2-build/results_build.json level-3-deep/results_deep.json analysis/
