name: Pages

# Builds the live dashboard in site/ from the committed results files and publishes it to GitHub Pages.
# Pages must use the GitHub Actions source (build_type workflow); the old docs/index.md page is no longer served.
on:
  push:
    branches: [main]
    paths: ['site/**', 'level-*/results_*.json', 'analysis/results_*.json', 'ROADMAP.md', 'README.md', 'docs/index.md', 'level-1-learn/ANATOMY.md', 'level-2-build/qa_service.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
